<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="220" stroke="#1e293b" stroke-width="8" fill="none" />
  <circle cx="256" cy="256" r="190" stroke="#10b981" stroke-width="4" stroke-dasharray="12,12" fill="none" opacity="0.6" />

  <g transform="translate(128, 120)">
    <!-- House / Roof Accent (Emerald green) -->
    <path d="M20 160 L128 50 L236 160" stroke="#10b981" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Building block structural line (Gold) -->
    <path d="M128 50 L128 220" stroke="#fbbf24" stroke-width="18" stroke-linecap="round" fill="none" />
    
    <!-- Stylized structural columns (Modern architectural sketch detail) -->
    <rect x="56" y="160" width="24" height="80" rx="6" fill="#10b981" />
    <rect x="176" y="160" width="24" height="80" rx="6" fill="#10b981" />
    <rect x="116" y="120" width="24" height="120" rx="6" fill="#fbbf24" />
    
    <!-- Underline platform -->
    <line x1="10" y1="240" x2="246" y2="240" stroke="#ea580c" stroke-width="16" stroke-linecap="round" />
  </g>
  
  <!-- Modern clean initials "AG" subtly at the bottom -->
  <text x="256" y="440" font-family="'Inter', sans-serif, system-ui" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="4" text-anchor="middle" opacity="0.9">INMOBILIARIA</text>
</svg>
